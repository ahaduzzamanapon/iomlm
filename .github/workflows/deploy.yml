name: Deploy to Live Server via FTP

on:
  push:
    branches:
      - live

jobs:
  web-deploy:
    name: 🎉 Deploying to Live Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 1021
          server-dir: '/'
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .env*
            **/.env*
            .npmrc
            **/.npmrc
            .*
            storage/**
            tests/**
            .editorconfig
            .gitattributes
            .gitignore
            README.md
            package.json
            package-lock.json
            vite.config.js
            public/.htaccess
            **/.htaccess
            learning-plus.zip
            inspect_data.php
            wipe_data.php
